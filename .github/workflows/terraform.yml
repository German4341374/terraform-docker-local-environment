name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_postgres_password: ci-only-password-not-a-secret

jobs:
  validate:
    name: Format, validate, lint, test, and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.63.1
      - name: Initialize providers without a backend
        run: terraform init -backend=false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Validate configuration
        run: terraform validate
      - name: Run mocked Terraform tests
        run: terraform test
      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive
      - name: Run Trivy Terraform misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.72.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  plan:
    name: Produce non-applying development plan
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize providers without a backend
        run: terraform init -backend=false
      - name: Create plan only
        run: >-
          terraform plan -input=false -refresh=false
          -var-file=environments/development.tfvars
          -out=development.tfplan
      - name: Render human-readable plan
        run: terraform show -no-color development.tfplan > development-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: development-plan.txt
          retention-days: 7
